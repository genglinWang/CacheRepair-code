[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "cacherepair"
version = "1.0.0"
description = "Learning to repair cross-chunk context in RAG for KV cache fusion"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.9"
authors = [{name = "CacheRepair authors"}]
dependencies = ["torch>=2.6,<2.7", "safetensors>=0.4.5,<1", "huggingface-hub>=0.30,<1", "transformers>=4.51.3,<4.58"]

[project.optional-dependencies]
eval = ["vllm==0.8.5", "transformers==4.57.6", "accelerate>=0.30,<2", "pyarrow>=15,<20", "matplotlib>=3.9,<4", "numpy>=1.26,<3"]
data = ["pyarrow>=15,<20"]
plots = ["matplotlib>=3.9,<4", "numpy>=1.26,<3"]

[tool.setuptools]
py-modules = ["sitecustomize"]

[tool.setuptools.packages.find]
include = ["cacherepair*"]

[tool.setuptools.package-data]
cacherepair = ["assets/evaluation/*.json", "assets/evaluation/*.jsonl"]

[project.urls]
Paper = "https://arxiv.org/abs/2609.35139"
Repository = "https://github.com/genglinWang/CacheRepair-code"
Models = "https://huggingface.co/gwang3456/cacherepair"
